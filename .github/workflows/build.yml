name: build

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ '**.md', 'docs/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.14", "3.13", "3.12", "3.11", "3.10"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"

    runs-on: ${{ matrix.os }}
    permissions:
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
    - name: Install dependencies
      run: |
        pip install pip==26.2.1
        pip install build==1.6.1
    - name: Build package
      run: |
        python -m build
    - name: Install package
      run: |
        pip install .
    - name: Test with pytest
      env:
          # This token is provided by Actions,
          # you do not need to create your own token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pip install ".[test]"
        coverage run -m pytest
        coverage xml -o coverage/python.xml
    # Same embed as the release, so SBOM problems show on the PR. Last, as
    # the action installs Pitloom and its dependencies into this Python.
    - name: Embed SBOM into wheel
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      uses: bact/pitloom@d95e9ed331a8463d49ef9cde8032aff5863e1e1e  # v0.20.2
      with:
        embed-wheel: "dist/*.whl"
        project-path: "."
        extras: "content-type,validate"
        content-type: "true"
        # magika is used to determine the content type of files
        content-type-method: "magika"
        # Fail if the SBOM is not at the PEP 770 location (--verify) or is
        # not valid SPDX 3 (--validate: schema and SHACL).
        args: "--verify --validate"
        upload-artifact: "false"
