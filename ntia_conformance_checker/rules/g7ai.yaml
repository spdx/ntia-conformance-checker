# G7 SBOM for AI: Minimum Elements, partial support.
#
# Rule ids, labels, provisions and composition (aggregation) follow the SBOM
# requirements ontology https://bact.github.io/bom/req/g7ai2026/ (0.3.0); the
# SPDX 3.0.1 fields follow https://bact.github.io/bom/mapping/g7ai2026-to-spdx30.sssom.tsv.
# Elements for which SPDX 3.0.1 has no field (mapping: GAP) or whose mapping is
# not yet reviewed are catalogue-only: listed, never checked.
# Source: G7 Cybersecurity Working Group, 2026, published by BSI.
# https://www.bsi.bund.de/SharedDocs/Downloads/EN/BSI/KI/SBOM-for-AI_minimum-elements.pdf

spec:
  id: g7ai
  rule_prefix: BOM-G7AI2026
  title: G7 2026 SBOM for AI Minimum Elements
  uri: https://www.bsi.bund.de/SharedDocs/Downloads/EN/BSI/KI/SBOM-for-AI_minimum-elements.pdf
  sbom_specs: [spdx3]
  taxonomies:
    category: g7ai-sbom-for-ai

categories:
  - id: metadata
    code: MD
    title: Metadata
  - id: system-level-properties
    code: SLP
    title: System Level Properties
  - id: models
    code: MDL
    title: Models
  - id: dataset-properties
    code: DP
    title: Dataset Properties
  - id: infrastructure
    code: INF
    title: Infrastructure
  - id: security-properties
    code: SP
    title: Security Properties
  - id: key-performance-indicators
    code: KPI
    title: Key Performance Indicators

